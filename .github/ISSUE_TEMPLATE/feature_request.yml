name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. This repo is the live codebase for a personal site, so feature requests are most likely to be accepted when they align with the site’s intent and voice.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      placeholder: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: What should change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: Any alternatives you’ve thought about?
    validations:
      required: false

